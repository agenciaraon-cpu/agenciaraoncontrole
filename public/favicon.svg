<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#102B59"/>
      <stop offset="100%" stop-color="#0878D9"/>
    </linearGradient>
    <linearGradient id="rocketBody" x1="20" y1="12" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="32" y1="42" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7817"/>
      <stop offset="100%" stop-color="#FFAE42"/>
    </linearGradient>
  </defs>

  <!-- Background rounded circle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Stars / Tech Sparks -->
  <circle cx="16" cy="18" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="48" cy="16" r="1.2" fill="#FFAE42" opacity="0.7"/>
  <circle cx="14" cy="46" r="1" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="50" cy="42" r="1.5" fill="#FFFFFF" opacity="0.5"/>

  <!-- Fire / Flame from Rocket -->
  <path d="M32 58 C29 50, 28 44, 32 40 C36 44, 35 50, 32 58 Z" fill="url(#fireGrad)"/>
  <path d="M32 52 C30.5 48, 30 45, 32 42 C34 45, 33.5 48, 32 52 Z" fill="#FFFFFF"/>

  <!-- Left Fin -->
  <path d="M24 34 L18 44 C22 45, 26 42, 27 38 Z" fill="#0878D9"/>

  <!-- Right Fin -->
  <path d="M40 34 L46 44 C42 45, 38 42, 37 38 Z" fill="#0878D9"/>

  <!-- Rocket Main Body -->
  <path d="M32 10 C26 20, 24 32, 27 42 C30 43, 34 43, 37 42 C40 32, 38 20, 32 10 Z" fill="url(#rocketBody)"/>

  <!-- Rocket Nose Tip / Accent -->
  <path d="M32 10 C29 15, 28 19, 28 22 C30 22.5, 34 22.5, 36 22 C36 19, 35 15, 32 10 Z" fill="#FF7817"/>

  <!-- Porthole Window -->
  <circle cx="32" cy="28" r="4.5" fill="#102B59"/>
  <circle cx="32" cy="28" r="3" fill="#0878D9"/>
  <circle cx="33.2" cy="26.8" r="1.2" fill="#FFFFFF" opacity="0.8"/>
</svg>
